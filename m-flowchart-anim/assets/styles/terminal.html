<div id="stage" data-style="terminal">
  <div class="win">
    <div class="win-bar"><i></i><i></i><i></i><span id="kicker"></span><span class="tm-clock" id="stepno"></span></div>
    <div class="tm-head">
      <div class="tm-titles"><h1 id="title"></h1><div id="subtitle"></div></div>
      <div id="stats"></div>
    </div>
    <div class="tm-prog"><span class="tm-lbl">pipeline</span><div id="progress"><i></i></div></div>
    <div class="tm-main">
      <div class="tm-side">
        <div class="panel tm-tasks"><div class="panel-h">tasks</div><div id="tasks"></div></div>
        <div class="panel tm-ctx"><div class="panel-h">context</div><div id="summary"></div></div>
      </div>
      <div class="panel tm-dia"><div class="panel-h">flow · live</div><div id="diagram"></div></div>
    </div>
    <div class="panel tm-log"><div class="panel-h">session log</div><div id="captions"></div></div>
    <div class="tm-prompt"><span class="tm-ps">~/flow $</span> <span id="footer"></span><b class="cursor"></b></div>
  </div>
</div>
